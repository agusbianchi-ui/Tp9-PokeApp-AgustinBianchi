<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142b2c" />
    <title>PokeApp · Atlas Pokémon</title>
    <link rel="icon" href="./recursos/imagenes/sin-imagen.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <a class="saltar-contenido" href="#contenido-principal">Ir al contenido</a>

    <!-- Marca y navegación principal -->
    <aside class="barra-lateral">
      <button class="marca" id="volver-portada" type="button" aria-label="Volver al inicio">
        <span class="simbolo-marca" aria-hidden="true"></span>
        <span>
          PokeApp
          <small>ATLAS POKÉMON</small>
        </span>
      </button>

      <div class="rotulo-menu">TU EXPEDICIÓN</div>

      <nav class="navegacion" aria-label="Navegación principal">
        <a href="#inicio" data-vista="inicio">
          <span aria-hidden="true">00</span>
          Inicio
        </a>
        <a href="#especies" data-vista="especies">
          <span aria-hidden="true">01</span>
          Pokédex
        </a>
        <a href="#acceso" data-vista="acceso" id="enlace-acceso">
          <span aria-hidden="true">02</span>
          Iniciar sesión
        </a>
        <a href="#inscripcion" data-vista="inscripcion" id="enlace-inscripcion">
          <span aria-hidden="true">03</span>
          Registrarse
        </a>
        <a href="#arena" data-vista="arena">
          <span aria-hidden="true">04</span>
          Batalla
        </a>
        <a href="#carga" data-vista="carga" id="enlace-carga" hidden>
          <span aria-hidden="true">05</span>
          Cargar Pokémon
        </a>
      </nav>

      <div class="nota-menu">
        <span class="punto-estado"></span>
        Región Kanto
        <small>Todo viaje empieza con curiosidad.</small>
      </div>
    </aside>

    <div class="espacio">
      <header class="barra-superior">
        <p>ARCHIVO DE CAMPO <span>/ POKÉDEX</span></p>
        <div id="identidad-activa" class="identidad-activa"></div>
      </header>

      <p id="aviso-general" class="mensaje aviso-general" role="status" hidden></p>

      <!-- Las funciones de JavaScript muestran las vistas en este elemento. -->
      <main id="contenido-principal" class="contenido" tabindex="-1"></main>

      <noscript>
        <p class="mensaje">Activá JavaScript para utilizar PokeApp.</p>
      </noscript>

      <footer class="pie-pagina">
        <p>PokeApp · Proyecto educativo · TP 9</p>
        <p>Explorá. Descubrí. Conocé.</p>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
